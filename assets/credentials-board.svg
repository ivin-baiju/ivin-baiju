<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="100%" height="100%" role="img" aria-label="Academic Foundations and Selected Certifications">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cond { font-family: 'Arial Narrow', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .bu-dot { animation: dotPulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ==================== LEFT CARD: EDUCATION (BU.) ==================== -->
  <g transform="translate(0, 0)">
    <rect width="430" height="360" rx="10" fill="#171A1E" stroke="#363D44" stroke-width="1.2"/>
    <text x="28" y="34" class="mono" font-size="8.5" font-weight="800" fill="#969EA6" letter-spacing="1.6"><tspan fill="#F05A28">05</tspan>   EDUCATION / 01</text>
    <text x="402" y="36" text-anchor="end" class="mono" font-size="16" font-weight="800" fill="#F05A28">↗</text>

    <text x="28" y="130" class="cond" font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">BU<tspan class="bu-dot" fill="#F05A28">.</tspan></text>
    <text x="28" y="168" class="mono" font-size="9.5" font-weight="800" fill="#F05A28" letter-spacing="1.8">2025 — 2029</text>
    <text x="28" y="198" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">Bennett University</text>
    <text x="28" y="220" class="sans" font-size="12" fill="#B2B8BE">B.Tech · Computer Science and Engineering</text>

    <line x1="28" y1="256" x2="402" y2="256" stroke="#454C53" stroke-width="1"/>

    <text x="28" y="296" class="cond" font-size="30" font-weight="800" fill="#FFFFFF">8.00</text>
    <text x="28" y="316" class="mono" font-size="7.5" font-weight="800" fill="#9199A1" letter-spacing="1.2">FIRST-YEAR CGPA</text>

    <text x="172" y="296" class="cond" font-size="30" font-weight="800" fill="#FFFFFF">82%</text>
    <text x="172" y="316" class="mono" font-size="7.5" font-weight="800" fill="#9199A1" letter-spacing="1.2">CLASS XII · CBSE</text>

    <text x="304" y="296" class="cond" font-size="30" font-weight="800" fill="#FFFFFF">86%</text>
    <text x="304" y="316" class="mono" font-size="7.5" font-weight="800" fill="#9199A1" letter-spacing="1.2">CLASS X · CBSE</text>
  </g>

  <!-- ==================== RIGHT CARD: SELECTED CERTIFICATIONS ==================== -->
  <g transform="translate(454, 0)">
    <rect width="666" height="360" rx="10" fill="#1B1F24" stroke="#363D44" stroke-width="1.2"/>
    <text x="28" y="34" class="mono" font-size="8.5" font-weight="800" fill="#969EA6" letter-spacing="1.6">SELECTED CERTIFICATIONS &amp; MILESTONES</text>
    <text x="638" y="34" text-anchor="end" class="mono" font-size="8.5" font-weight="800" fill="#F05A28" letter-spacing="1.4">05 RECORDS</text>

    <!-- Cert 01 -->
    <line x1="28" y1="50" x2="638" y2="50" stroke="#363D44" stroke-width="1"/>
    <text x="28" y="80" class="cond" font-size="18" font-weight="800" fill="#F05A28">01</text>
    <text x="64" y="76" class="sans" font-size="13" font-weight="800" fill="#FFFFFF">CS201: Elementary Data Structures</text>
    <text x="64" y="94" class="sans" font-size="10" fill="#8C939A">Saylor University  <tspan fill="#F05A28">·</tspan>  October 2025</text>
    <text x="638" y="82" text-anchor="end" class="mono" font-size="14" fill="#A6ADB3">↗</text>

    <!-- Cert 02 -->
    <line x1="28" y1="110" x2="638" y2="110" stroke="#363D44" stroke-width="1"/>
    <text x="28" y="140" class="cond" font-size="18" font-weight="800" fill="#F05A28">02</text>
    <text x="64" y="136" class="sans" font-size="13" font-weight="800" fill="#FFFFFF">CS403: Introduction to Modern Database Systems</text>
    <text x="64" y="154" class="sans" font-size="10" fill="#8C939A">Saylor University  <tspan fill="#F05A28">·</tspan>  October 2025</text>
    <text x="638" y="142" text-anchor="end" class="mono" font-size="14" fill="#A6ADB3">↗</text>

    <!-- Cert 03 -->
    <line x1="28" y1="170" x2="638" y2="170" stroke="#363D44" stroke-width="1"/>
    <text x="28" y="200" class="cond" font-size="18" font-weight="800" fill="#F05A28">03</text>
    <text x="64" y="196" class="sans" font-size="13" font-weight="800" fill="#FFFFFF">Engineering Reports and Research Publishing</text>
    <text x="64" y="214" class="sans" font-size="10" fill="#8C939A">Coursera  <tspan fill="#F05A28">·</tspan>  September 2025</text>
    <text x="638" y="202" text-anchor="end" class="mono" font-size="14" fill="#A6ADB3">↗</text>

    <!-- Cert 04 -->
    <line x1="28" y1="230" x2="638" y2="230" stroke="#363D44" stroke-width="1"/>
    <text x="28" y="260" class="cond" font-size="18" font-weight="800" fill="#F05A28">04</text>
    <text x="64" y="256" class="sans" font-size="13" font-weight="800" fill="#FFFFFF">Ethics for Engineers, Patents, Copyrights &amp; IPR</text>
    <text x="64" y="274" class="sans" font-size="10" fill="#8C939A">Coursera  <tspan fill="#F05A28">·</tspan>  September 2025</text>
    <text x="638" y="262" text-anchor="end" class="mono" font-size="14" fill="#A6ADB3">↗</text>

    <!-- Cert 05 -->
    <line x1="28" y1="290" x2="638" y2="290" stroke="#363D44" stroke-width="1"/>
    <text x="28" y="320" class="cond" font-size="18" font-weight="800" fill="#F05A28">05</text>
    <text x="64" y="316" class="sans" font-size="13" font-weight="800" fill="#FFFFFF">Introduction to Microprocessors</text>
    <text x="64" y="334" class="sans" font-size="10" fill="#8C939A">Arm  <tspan fill="#F05A28">·</tspan>  September 2025</text>
    <text x="638" y="322" text-anchor="end" class="mono" font-size="14" fill="#A6ADB3">↗</text>
  </g>
</svg>
