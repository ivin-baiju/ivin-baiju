    <text x="20" y="22" class="mono" font-size="8.5" font-weight="800" fill="#E2E8ED" letter-spacing="1.4">M / 002  <tspan opacity="0.65">GEOSPATIAL INTELLIGENCE CONSOLE</tspan></text>

