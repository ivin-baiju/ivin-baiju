    <text x="292" y="136" class="mono" font-size="7.5" font-weight="700" fill="#F05A28">✈ AI 672</text>

    <text x="20" y="167" class="mono" font-size="7.5" font-weight="800" fill="#E0EDF0" opacity="0.65" letter-spacing="1.2">TRAFFIC / SIMULATED</text>
    <text x="526" y="167" text-anchor="end" class="mono" font-size="7.5" font-weight="800" fill="#E0EDF0" opacity="0.65" letter-spacing="1.2">DETECT · DECIDE · DIRECT</text>

