<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="100%" height="100%" role="img" aria-label="Selected Work and Experiments — Visionlytics, Monarch, ATC Simulation, Small Model Systems">
  <defs>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulseBeacon {
        0%, 100% { r: 4px; opacity: 1; }
        50% { r: 7px; opacity: 0.45; }
      }
      @keyframes stackPulse {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(5px); }
      }
      @keyframes stackPulseAlt {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-5px); }
      }
      .vis-ring-a { transform-origin: 274px 124px; animation: spinCW 22s linear infinite; }
      .vis-ring-b { transform-origin: 274px 124px; animation: spinCCW 32s linear infinite; }
      .radar-sweep { transform-origin: 274px 444px; animation: spinCW 6.5s linear infinite; }
      .beacon { animation: pulseBeacon 2s ease-in-out infinite; }
      .layer-even { animation: stackPulse 3.6s ease-in-out infinite; }
      .layer-odd { animation: stackPulseAlt 3.6s ease-in-out infinite; }
    </style>
    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3DDD0"/>
      <stop offset="52%" stop-color="#B7C9BD"/>
      <stop offset="100%" stop-color="#D9DFD6"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8DBB99" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#17252B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ==================== CARD 1: VISIONLYTICS (TOP-LEFT) ==================== -->
  <g transform="translate(0, 0)">
    <rect width="546" height="324" rx="10" fill="#1B1F24" stroke="#363D44" stroke-width="1.2"/>
    <!-- Visual Area -->
    <rect x="1" y="1" width="544" height="174" rx="9" fill="#E8ECE7"/>
    <text x="20" y="22" class="mono" font-size="8.5" font-weight="800" fill="#263A37" letter-spacing="1.4">V / 001  <tspan opacity="0.65">OPTICAL TELEMETRY · APACHE-2.0 ONNX</tspan></text>
    <!-- Satellite Viewport -->
    <rect x="56" y="32" width="434" height="120" fill="url(#visionGrad)" stroke="#9AAFA3" stroke-width="1"/>
    <!-- Land Polygon -->
    <polygon points="120,42 260,36 300,58 410,54 460,86 390,115 430,138 280,148 220,128 96,134 75,92" fill="#8DA99A" opacity="0.52"/>
    <!-- Animated Scan Rings -->
    <circle class="vis-ring-b" cx="274" cy="92" r="54" fill="none" stroke="#F05A28" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.75"/>
    <circle class="vis-ring-a" cx="274" cy="92" r="34" fill="none" stroke="#F05A28" stroke-width="1.2" stroke-dasharray="18 6"/>
    <circle class="beacon" cx="274" cy="92" r="5" fill="#F05A28"/>
    <line x1="258" y1="92" x2="290" y2="92" stroke="#F05A28" stroke-width="1.2"/>
    <line x1="274" y1="76" x2="274" y2="108" stroke="#F05A28" stroke-width="1.2"/>
    <!-- Readouts -->
    <text x="68" y="48" class="mono" font-size="8" font-weight="800" fill="#263A37">mAP50 / 91.43%</text>
    <text x="68" y="60" class="mono" font-size="8" font-weight="800" fill="#263A37">mAP50-95 / 85.14%</text>
    <text x="478" y="48" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#36594B">60FPS</text>
    <text x="478" y="144" text-anchor="end" class="mono" font-size="8" font-weight="800" fill="#263A37">CIEDE2000 / 85.71% · MAE 0.00</text>
    <text x="20" y="167" class="mono" font-size="7.5" font-weight="800" fill="#263A37" opacity="0.7" letter-spacing="1.2">OPTICAL BENCH · v1.0.0</text>
    <text x="526" y="167" text-anchor="end" class="mono" font-size="7.5" font-weight="800" fill="#263A37" opacity="0.7" letter-spacing="1.2">FRAME → INSIGHT</text>

    <!-- Content Area -->
    <text x="22" y="198" class="mono" font-size="8" font-weight="800" fill="#8A9299" letter-spacing="1.4">COMPUTER VISION SAAS · MULTI-OBJECT TRACKING</text>
    <circle cx="402" cy="195" r="3.5" fill="#8FBD9C"/>
    <text x="412" y="198" class="mono" font-size="8" font-weight="800" fill="#8FBD9C" letter-spacing="1">LIVE PRODUCTION v1.0</text>

    <text x="22" y="228" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">Visionlytics<tspan fill="#F05A28">.</tspan></text>
    <text x="22" y="250" class="sans" font-size="11" fill="#ADB3B9">Per-frame people count &amp; ByteTrack Re-ID, calibrated RT-DETRv2 &amp; YOLOS ONNX,</text>
    <text x="22" y="266" class="sans" font-size="11" fill="#ADB3B9">foreground CIELAB/CIEDE2000 garment colour naming, ray-cast zones &amp; Training Studio.</text>

    <!-- Tags -->
    <rect x="22" y="282" width="106" height="22" rx="3" fill="#262C33"/><text x="75" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">React 19 + WebGL2</text>
    <rect x="134" y="282" width="122" height="22" rx="3" fill="#262C33"/><text x="195" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">Fastify + TimescaleDB</text>
    <rect x="262" y="282" width="96" height="22" rx="3" fill="#262C33"/><text x="310" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">FastAPI + ONNX</text>
    <rect x="364" y="282" width="84" height="22" rx="3" fill="#262C33"/><text x="406" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">CIELAB ΔE00</text>
    <rect x="454" y="282" width="70" height="22" rx="3" fill="#F05A28" fill-opacity="0.16" stroke="#F05A28" stroke-width="0.8"/><text x="489" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="800" fill="#F05A28">LIVE ↗</text>
  </g>

  <!-- ==================== CARD 2: MONARCH (TOP-RIGHT) ==================== -->
  <g transform="translate(574, 0)">
