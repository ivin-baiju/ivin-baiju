    <text x="22" y="250" class="sans" font-size="11" fill="#ADB3B9">AI air-traffic-control simulation concept: replay flight traffic, inject close-call</text>
    <text x="22" y="266" class="sans" font-size="11" fill="#ADB3B9">conflict scenarios, detect separation violations, and test autonomous controller vectors.</text>

