    <text x="472" y="102" text-anchor="end" class="mono" font-size="7" fill="#A4B5BA">28° 27' 18" N · 77° 30' 09" E</text>

    <!-- Stat Boxes -->
    <rect x="104" y="122" width="120" height="24" fill="#28343C"/><text x="112" y="132" class="mono" font-size="6" fill="#97A4AA">ACTIVE LAYERS</text><text x="214" y="140" text-anchor="end" class="mono" font-size="10" font-weight="800" fill="#FFFFFF">08</text>
    <rect x="232" y="122" width="120" height="24" fill="#28343C"/><text x="240" y="132" class="mono" font-size="6" fill="#97A4AA">DATA SOURCES</text><text x="342" y="140" text-anchor="end" class="mono" font-size="10" font-weight="800" fill="#FFFFFF">12</text>
    <rect x="360" y="122" width="120" height="24" fill="#28343C"/><text x="368" y="132" class="mono" font-size="6" fill="#97A4AA">STATUS</text><text x="470" y="140" text-anchor="end" class="mono" font-size="10" font-weight="800" fill="#8FBD9C">READY</text>

    <text x="20" y="167" class="mono" font-size="7.5" font-weight="800" fill="#E2E8ED" opacity="0.65" letter-spacing="1.2">SPATIAL SYSTEMS · 02</text>
    <text x="526" y="167" text-anchor="end" class="mono" font-size="7.5" font-weight="800" fill="#E2E8ED" opacity="0.65" letter-spacing="1.2">SEE THE BIGGER PICTURE</text>

    <!-- Content Area -->
    <text x="22" y="198" class="mono" font-size="8" font-weight="800" fill="#8A9299" letter-spacing="1.4">GEOSPATIAL · PRODUCT ENGINEERING</text>
    <circle cx="430" cy="195" r="3.5" fill="#8FBD9C"/>
    <text x="440" y="198" class="mono" font-size="8" font-weight="800" fill="#8FBD9C" letter-spacing="1">IN DEVELOPMENT</text>

    <text x="22" y="228" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">MONARCH<tspan fill="#F05A28">.</tspan></text>
    <text x="22" y="250" class="sans" font-size="11" fill="#ADB3B9">Dark-first geospatial intelligence console built around georeferenced imagery,</text>
    <text x="22" y="266" class="sans" font-size="11" fill="#ADB3B9">spatial layer bounds, multi-source telemetry feeds, and high-density navigation.</text>

    <rect x="22" y="282" width="66" height="22" rx="3" fill="#262C33"/><text x="55" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">React</text>
    <rect x="94" y="282" width="84" height="22" rx="3" fill="#262C33"/><text x="136" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">TypeScript</text>
    <rect x="184" y="282" width="98" height="22" rx="3" fill="#262C33"/><text x="233" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">Framer Motion</text>
    <rect x="288" y="282" width="114" height="22" rx="3" fill="#262C33"/><text x="345" y="296" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#D1D5DA">Geospatial Layers</text>
  </g>

