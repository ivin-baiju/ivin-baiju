<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="100%" height="100%" role="img" aria-label="Ivin Baiju — Ideas into Intelligent Systems">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A1E"/>
      <stop offset="50%" stop-color="#1F2328"/>
      <stop offset="100%" stop-color="#15181C"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#7B858F" stroke-width="0.7" stroke-opacity="0.16"/>
    </pattern>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F05A28" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F05A28" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F05A28" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cond { font-family: 'Arial Narrow', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      @keyframes rotateCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes rotateCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulseDot {
        0%, 100% { r: 4.5px; opacity: 1; }
        50% { r: 6.5px; opacity: 0.7; }
      }
      @keyframes pulseHalo {
        0%, 100% { r: 8px; opacity: 0.35; }
        50% { r: 15px; opacity: 0.05; }
      }
      @keyframes floatA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes sweepLine {
        0% { transform: translateY(-380px); }
        100% { transform: translateY(420px); }
      }
      .orbit1 { transform-origin: 940px 210px; animation: rotateCW 64s linear infinite; }
      .orbit2 { transform-origin: 940px 210px; animation: rotateCCW 42s linear infinite; }
      .live-core { animation: pulseDot 2.2s ease-in-out infinite; }
      .live-halo { animation: pulseHalo 2.2s ease-in-out infinite; }
      .chip-top { animation: floatA 4.2s ease-in-out infinite; }
      .chip-bot { animation: floatB 4.8s ease-in-out infinite; }
      .cursor { animation: blinkCursor 1.1s step-end infinite; }
      .scanner { animation: sweepLine 7.5s linear infinite; }
    </style>
  </defs>

  <!-- Outer Card Shell -->
  <rect width="1120" height="420" rx="12" fill="url(#bg)" stroke="#3A4047" stroke-width="1.5"/>
  <rect width="1120" height="420" rx="12" fill="url(#grid)"/>

  <!-- Top Orange Accent Bar -->
  <rect x="0" y="0" width="1120" height="3" rx="2" fill="#F05A28"/>

  <!-- Subtle Vertical Scan Beam -->
  <rect class="scanner" x="0" y="0" width="1120" height="56" fill="url(#scan)" pointer-events="none"/>

  <!-- Animated Orbital Rings (Right Background) -->
  <circle class="orbit1" cx="940" cy="210" r="265" fill="none" stroke="#F05A28" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="10 8"/>
  <circle class="orbit2" cx="940" cy="210" r="190" fill="none" stroke="#8EBAE0" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4 10"/>
  <circle cx="940" cy="210" r="325" fill="none" stroke="#F05A28" stroke-opacity="0.09" stroke-width="1"/>

  <!-- Header Strip -->
  <line x1="0" y1="52" x2="1120" y2="52" stroke="#363D44" stroke-width="1"/>
  <text x="38" y="33" class="mono" font-size="16" font-weight="800" fill="#F05A28" letter-spacing="-1">&lt;/&gt;</text>
  <text x="72" y="33" class="sans" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">ivin<tspan fill="#F05A28">.</tspan></text>

  <text x="488" y="31" class="mono" font-size="9" font-weight="700" fill="#9EA5AD" letter-spacing="1.6">01 WORK  ·  02 EXPLORE  ·  03 ABOUT  ·  04 TOOLKIT  ·  05 CREDENTIALS</text>
  <rect x="972" y="14" width="112" height="24" rx="3" fill="#F05A28" fill-opacity="0.12" stroke="#F05A28" stroke-width="1"/>
  <text x="1028" y="29" text-anchor="middle" class="mono" font-size="9" font-weight="800" fill="#F05A28" letter-spacing="1.4">IVIN.IN ↗</text>

  <!-- Left Column: Hero Copy -->
  <circle class="live-halo" cx="44" cy="88" r="10" fill="#F05A28"/>
  <circle class="live-core" cx="44" cy="88" r="4.5" fill="#F05A28"/>
  <text x="60" y="92" class="mono" font-size="10" font-weight="800" fill="#BFC4C9" letter-spacing="2.4">AI · SOFTWARE · COMPUTER VISION · SYSTEMS</text>

  <text x="38" y="156" class="sans" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-2.6">Ideas into</text>
  <text x="38" y="220" class="cond" font-size="66" font-weight="800" fill="#F05A28" letter-spacing="-1">INTELLIGENT</text>
  <text x="38" y="282" class="sans" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-2.6">systems<tspan fill="#F05A28">.</tspan></text>

  <text x="38" y="314" class="sans" font-size="12" font-weight="500" fill="#B7BBC0">I’m Ivin Baiju — exploring the space where AI, computer vision,</text>
  <text x="38" y="332" class="sans" font-size="12" font-weight="500" fill="#B7BBC0">and systems engineering meet real-world software.</text>

  <!-- Left Footnote -->
  <text x="38" y="366" class="mono" font-size="11" font-weight="800" fill="#F05A28">01 / 06</text>
  <text x="98" y="366" class="mono" font-size="9.5" font-weight="700" fill="#8D949C" letter-spacing="1.5">CURIOSITY FIRST. BUILD WITH INTENT.</text>

  <!-- Right Column: Animated Engineering Console -->
  <text x="560" y="78" class="mono" font-size="8.5" font-weight="800" fill="#7E8790" letter-spacing="1.8">PERSONAL ENGINEERING LOG</text>
  <text x="1064" y="78" text-anchor="end" class="mono" font-size="8.5" font-weight="800" fill="#7E8790" letter-spacing="1.8">VOL. 001 — 2026</text>

  <!-- Offset Orange Wireframe Behind Console -->
  <rect x="550" y="98" width="504" height="244" rx="6" fill="none" stroke="#F05A28" stroke-opacity="0.38" stroke-width="1"/>

  <!-- Main Console Window -->
  <rect x="560" y="88" width="504" height="244" rx="6" fill="#171A1E" stroke="#4A525A" stroke-width="1.2"/>
  <line x1="560" y1="124" x2="1064" y2="124" stroke="#363D44" stroke-width="1"/>

  <!-- Window Traffic Dots -->
  <circle cx="580" cy="106" r="4" fill="#F05A28"/>
  <circle cx="594" cy="106" r="4" fill="#D9B36B"/>
  <circle cx="608" cy="106" r="4" fill="#8CB697"/>
  <text x="628" y="110" class="mono" font-size="10.5" fill="#9EA5AD">ivin@workspace <tspan fill="#FFFFFF" font-weight="700">~/building</tspan></text>
  <text x="1044" y="110" text-anchor="end" class="mono" font-size="12" fill="#7F8992">⌘</text>

  <!-- Console Code Lines -->
  <text x="580" y="150" class="mono" font-size="11.5">
    <tspan fill="#59616A">01  </tspan><tspan fill="#A5A9AF">const</tspan> <tspan fill="#8EBAE0">direction</tspan> <tspan fill="#D1D5DA">= {</tspan>
  </text>
  <text x="580" y="172" class="mono" font-size="11.5">
    <tspan fill="#59616A">02    </tspan><tspan fill="#C7A3DF">focus</tspan><tspan fill="#D1D5DA">: </tspan><tspan fill="#8FBD9C">"AI, CV &amp; intelligent systems"</tspan><tspan fill="#D1D5DA">,</tspan>
  </text>
  <text x="580" y="194" class="mono" font-size="11.5">
    <tspan fill="#59616A">03    </tspan><tspan fill="#C7A3DF">flagship</tspan><tspan fill="#D1D5DA">: [</tspan><tspan fill="#8FBD9C">"VISIONLYTICS"</tspan><tspan fill="#D1D5DA">, </tspan><tspan fill="#8FBD9C">"SLM_ENGINE"</tspan><tspan fill="#D1D5DA">, </tspan><tspan fill="#8FBD9C">"MONARCH"</tspan><tspan fill="#D1D5DA">],</tspan>
  </text>
  <text x="580" y="216" class="mono" font-size="11.5">
    <tspan fill="#59616A">04    </tspan><tspan fill="#C7A3DF">approach</tspan><tspan fill="#D1D5DA">: </tspan><tspan fill="#8FBD9C">"learn → build → refine"</tspan><tspan fill="#D1D5DA">,</tspan>
  </text>
  <text x="580" y="238" class="mono" font-size="11.5">
    <tspan fill="#59616A">05  </tspan><tspan fill="#D1D5DA">};</tspan>
  </text>
  <text x="580" y="264" class="mono" font-size="11.5">
    <tspan fill="#59616A">06  </tspan><tspan fill="#A5A9AF">while</tspan><tspan fill="#D1D5DA"> (</tspan><tspan fill="#8EBAE0">ideas</tspan><tspan fill="#D1D5DA">.length) </tspan><tspan fill="#F05A28">build</tspan><tspan fill="#D1D5DA">(ideas.shift());</tspan>
  </text>
  <rect class="cursor" x="928" y="253" width="7" height="14" fill="#F05A28"/>

  <!-- Console Status Footer -->
  <line x1="580" y1="286" x2="1044" y2="286" stroke="#343B42" stroke-width="1"/>
  <text x="580" y="310" class="mono" font-size="9.5" font-weight="700" fill="#8FBD9C" letter-spacing="1.2">✓  SYSTEM READY · ALL PIPELINES VERIFIED</text>
  <text x="1044" y="310" text-anchor="end" class="mono" font-size="9.5" font-weight="800" fill="#F05A28" letter-spacing="1.2">● EXPLORING &amp; SHIPPING</text>

  <!-- Floating Chip 1: Top Right -->
  <g class="chip-top">
    <rect x="938" y="64" width="156" height="44" rx="4" fill="#282E34" stroke="#4C535B" stroke-width="1.2"/>
    <text x="952" y="92" class="mono" font-size="18" font-weight="800" fill="#F05A28">✳</text>
    <text x="976" y="83" class="mono" font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">AI / ML &amp; CV</text>
    <text x="976" y="97" class="sans" font-size="8.5" fill="#939BA3">Learning by building</text>
  </g>

  <!-- Floating Chip 2: Bottom Left of Console -->
  <g class="chip-bot">
    <rect x="560" y="336" width="178" height="38" rx="4" fill="#282E34" stroke="#4C535B" stroke-width="1.2"/>
    <text x="574" y="360" class="mono" font-size="15" font-weight="800" fill="#F05A28">⌘</text>
    <text x="598" y="352" class="mono" font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.2">SYSTEMS ENGINEERING</text>
    <text x="598" y="365" class="sans" font-size="8" fill="#939BA3">From idea to production</text>
  </g>

  <!-- Crosshairs & Fig Caption -->
  <text x="536" y="138" class="mono" font-size="18" fill="#F05A28">+</text>
  <text x="1078" y="306" class="mono" font-size="18" fill="#F05A28">+</text>
  <text x="1064" y="359" text-anchor="end" class="mono" font-size="8.5" font-weight="700" fill="#7E8790" letter-spacing="1">
    <tspan fill="#F05A28">FIG. 01</tspan>  A MIND WIRED TO MAKE THINGS WORK.
  </text>

  <!-- Bottom Strip -->
  <line x1="0" y1="384" x2="1120" y2="384" stroke="#41474E" stroke-width="1"/>
  <text x="38" y="406" class="mono" font-size="8.5" font-weight="800" fill="#808891" letter-spacing="1.8">BASED IN INDIA · BENNETT UNIVERSITY CSE · BUILDING EVERYWHERE</text>
  <text x="1082" y="406" text-anchor="end" class="mono" font-size="8.5" font-weight="800" fill="#808891" letter-spacing="1.8">SCROLL TO EXPLORE <tspan fill="#F05A28" font-size="12">↓</tspan></text>
</svg>
