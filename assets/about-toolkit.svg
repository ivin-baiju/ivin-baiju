<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="100%" height="100%" role="img" aria-label="About Ivin Baiju and The Working Toolkit">
  <defs>
    <pattern id="aboutGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#7B858F" stroke-width="0.6" stroke-opacity="0.14"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cond { font-family: 'Arial Narrow', Impact, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      @keyframes stampGlow {
        0%, 100% { stroke: #535B63; }
        50% { stroke: #F05A28; }
      }
      .stamp-box { animation: stampGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ==================== LEFT PANEL: ABOUT ME (03) ==================== -->
  <g transform="translate(0, 0)">
    <rect width="510" height="460" rx="10" fill="#171A1E" stroke="#363D44" stroke-width="1.2"/>
    <rect width="510" height="460" rx="10" fill="url(#aboutGrid)"/>

    <text x="28" y="36" class="mono" font-size="9" font-weight="800" fill="#B6BBC0" letter-spacing="1.8"><tspan fill="#F05A28" font-size="12">03</tspan>   A LITTLE CONTEXT · ABOUT ME</text>

    <text x="28" y="84" class="sans" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Curious by <tspan class="cond" fill="#F05A28">NATURE.</tspan></text>
    <text x="28" y="128" class="sans" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Engineer by <tspan class="cond" fill="#F05A28">PRACTICE.</tspan></text>

    <text x="28" y="168" class="sans" font-size="13.5" font-weight="700" fill="#FFFFFF">I’m Ivin — a computer science enthusiast drawn to the</text>
    <text x="28" y="188" class="sans" font-size="13.5" font-weight="700" fill="#FFFFFF">craft of making technology work in the real world.</text>

    <text x="28" y="218" class="sans" font-size="11.5" fill="#ADB3B9">I enjoy moving between ideas and implementation: understanding a problem,</text>
    <text x="28" y="236" class="sans" font-size="11.5" fill="#ADB3B9">getting close to the underlying technology, experimenting with an approach,</text>
    <text x="28" y="254" class="sans" font-size="11.5" fill="#ADB3B9">and refining it until it feels right. My current work connects explorations across</text>
    <text x="28" y="272" class="sans" font-size="11.5" fill="#FFFFFF" font-weight="700">VISIONLYTICS, SLM INFERENCE, MONARCH, NEXUS, and PRIMUS.</text>

    <!-- 2x2 Facts Table -->
    <line x1="28" y1="296" x2="482" y2="296" stroke="#434A51" stroke-width="1"/>
    <line x1="28" y1="344" x2="482" y2="344" stroke="#363D44" stroke-width="1"/>
    <line x1="28" y1="392" x2="482" y2="392" stroke="#434A51" stroke-width="1"/>

    <text x="28" y="313" class="mono" font-size="7.5" font-weight="800" fill="#858E97" letter-spacing="1.4">01 / BASE</text>
    <text x="28" y="331" class="sans" font-size="12" font-weight="700" fill="#F4F5F6">India</text>

    <text x="260" y="313" class="mono" font-size="7.5" font-weight="800" fill="#858E97" letter-spacing="1.4">02 / EDUCATION</text>
    <text x="260" y="331" class="sans" font-size="12" font-weight="700" fill="#F4F5F6">Bennett University (2025—2029)</text>

    <text x="28" y="361" class="mono" font-size="7.5" font-weight="800" fill="#858E97" letter-spacing="1.4">03 / TRACK</text>
    <text x="28" y="379" class="sans" font-size="12" font-weight="700" fill="#F4F5F6">B.Tech Computer Science</text>

    <text x="260" y="361" class="mono" font-size="7.5" font-weight="800" fill="#858E97" letter-spacing="1.4">04 / SPOKEN LANGUAGES</text>
    <text x="260" y="379" class="sans" font-size="12" font-weight="700" fill="#F4F5F6">English · Hindi · Malayalam</text>

    <!-- Stamp -->
    <rect class="stamp-box" x="28" y="406" width="38" height="38" fill="none" stroke="#535B63" stroke-width="1.2"/>
    <text x="47" y="431" text-anchor="middle" class="cond" font-size="20" font-weight="800" fill="#F05A28">IB</text>
    <text x="80" y="429" class="mono" font-size="8.5" font-weight="800" fill="#858D96" letter-spacing="1.8">THINK · BUILD · REPEAT</text>
  </g>

