      <rect x="72" y="0" width="46" height="24" rx="3" fill="#262C33"/><text x="95" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Vite</text>
      <rect x="124" y="0" width="58" height="24" rx="3" fill="#262C33"/><text x="153" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Fastify</text>
      <rect x="188" y="0" width="60" height="24" rx="3" fill="#262C33"/><text x="218" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">FastAPI</text>
      <rect x="254" y="0" width="58" height="24" rx="3" fill="#262C33"/><text x="283" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Node.js</text>
      <rect x="318" y="0" width="68" height="24" rx="3" fill="#262C33"/><text x="352" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Tailwind</text>
