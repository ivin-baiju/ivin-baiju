    <!-- Philosophy Callout Box -->
    <rect x="28" y="322" width="530" height="114" rx="6" fill="#15181C" stroke="#363D44" stroke-width="1"/>
    <text x="46" y="346" class="mono" font-size="8" font-weight="800" fill="#929AA2" letter-spacing="1.5">A NOTE ON THE PROCESS</text>
    <text x="46" y="376" class="sans" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">Understand the <tspan class="cond" fill="#F05A28">WHY.</tspan> Then build the how.</text>
    <text x="46" y="400" class="sans" font-size="11" fill="#A8AFB6">Tools change. Good fundamentals, clear thinking, and a willingness to</text>
    <text x="46" y="418" class="sans" font-size="11" fill="#A8AFB6">experiment travel much further.</text>
    <text x="536" y="418" text-anchor="end" class="mono" font-size="9" font-weight="800" fill="#F05A28">ALWAYS LEARNING ↗</text>
