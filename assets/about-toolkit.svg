    <text x="54" y="292" class="sans" font-size="12.5" font-weight="800" fill="#FFFFFF">Eng. Tools</text>
    <g transform="translate(175, 274)">
      <rect x="0" y="0" width="84" height="24" rx="3" fill="#262C33"/><text x="42" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Git &amp; GitHub</text>
      <rect x="90" y="0" width="84" height="24" rx="3" fill="#262C33"/><text x="132" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Google Colab</text>
      <rect x="180" y="0" width="66" height="24" rx="3" fill="#262C33"/><text x="213" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Logisim</text>
      <rect x="252" y="0" width="82" height="24" rx="3" fill="#262C33"/><text x="293" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Icarus Verilog</text>
      <rect x="340" y="0" width="54" height="24" rx="3" fill="#262C33"/><text x="367" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">GTKWave</text>
