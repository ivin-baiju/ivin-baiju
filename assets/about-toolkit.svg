      <rect x="96" y="0" width="64" height="24" rx="3" fill="#262C33"/><text x="128" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">PyTorch</text>
      <rect x="166" y="0" width="128" height="24" rx="3" fill="#262C33"/><text x="230" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">RT-DETRv2 &amp; ByteTrack</text>
      <rect x="300" y="0" width="84" height="24" rx="3" fill="#262C33"/><text x="342" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">CIELAB ΔE00</text>
    </g>

