      <rect x="54" y="0" width="60" height="24" rx="3" fill="#262C33"/><text x="84" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Python</text>
      <rect x="120" y="0" width="50" height="24" rx="3" fill="#262C33"/><text x="145" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Java</text>
      <rect x="176" y="0" width="76" height="24" rx="3" fill="#262C33"/><text x="214" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">TypeScript</text>
      <rect x="258" y="0" width="46" height="24" rx="3" fill="#262C33"/><text x="281" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">SQL</text>
      <rect x="310" y="0" width="52" height="24" rx="3" fill="#262C33"/><text x="336" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">GLSL</text>
    </g>

    <!-- Row 02: Development -->
    <line x1="28" y1="106" x2="558" y2="106" stroke="#363D44" stroke-width="1"/>
