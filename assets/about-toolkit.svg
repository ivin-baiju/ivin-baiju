    <text x="54" y="240" class="sans" font-size="12.5" font-weight="800" fill="#FFFFFF">DBs &amp; Infra</text>
    <g transform="translate(175, 222)">
      <rect x="0" y="0" width="90" height="24" rx="3" fill="#262C33"/><text x="45" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">PostgreSQL 16</text>
      <rect x="96" y="0" width="84" height="24" rx="3" fill="#262C33"/><text x="138" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">TimescaleDB</text>
      <rect x="186" y="0" width="96" height="24" rx="3" fill="#262C33"/><text x="234" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Redis &amp; BullMQ</text>
      <rect x="288" y="0" width="46" height="24" rx="3" fill="#262C33"/><text x="311" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">S3</text>
      <rect x="340" y="0" width="52" height="24" rx="3" fill="#262C33"/><text x="366" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#E0E4E8">Docker</text>
